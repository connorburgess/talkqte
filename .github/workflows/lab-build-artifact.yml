name: Development lab build artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Coordinator-approved assembled main commit (full lowercase SHA); build only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lab-build-artifact
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned development lab artifact
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate immutable dispatch before source checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/lab-build-artifact.mjs validate-commit "$SOURCE_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: npm ci
      - name: Check artifact contracts without building or launching
        run: node --test scripts/lab-build-artifact.test.mjs
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build exact features and prepare bounded archive/receipt
        run: node scripts/lab-build-artifact.mjs build "$SOURCE_COMMIT"
      - name: Upload only the checked archive and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talkqte-lab-${{ inputs.source_commit }}
          path: |
            ${{ runner.temp }}/talkqte-lab-artifact/TalkQTE-lab-arm64.zip
            ${{ runner.temp }}/talkqte-lab-artifact/build-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
