name: Windows and Ubuntu builds (unsigned)

# Installable, unsigned Windows and Ubuntu builds of the desktop app, made on
# every pull request and on manual dispatch, and uploaded as workflow
# artifacts only. Nothing here signs, notarises, publishes a release or
# touches an update feed. Each job also proves the build launches on its
# runner (Windows: the installed app's window; Ubuntu: the installed package
# in the current LTS, under a virtual display). That is all a hosted runner can
# show: no microphone, meeting app, real display or person is involved.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # TEMPORARY while the branch is iterated before its pull request opens.
  push:
    branches: ['cb/platform-*']

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('platform-builds-pr-{0}', github.event.pull_request.number) || format('platform-builds-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }} installers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rustup: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            # WiX 3, which Tauri uses for MSI, cannot target Arm64, so the
            # MSI is made for x64 only.
            bundles: nsis,msi
            # The Arm64 job in checks.yml already runs the tests and Clippy.
            tests: true
          - arch: arm64
            runner: windows-11-arm
            rustup: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            bundles: nsis
            tests: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/${{ matrix.rustup }}/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustc +1.97.1 -vV
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: platform-windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - if: matrix.tests
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      # A fictional key under a test-only service name, so nothing a person
      # stored is read or changed.
      - name: Round-trip a fictional key through the real Credential Manager
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_credential_manager -- --ignored
      - name: Build the release app and installers (unsigned)
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }}
      - name: Install with the NSIS installer, launch, uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'TalkQTE'
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          if (-not $app) { throw "The installer put no TalkQTE executable in $dir." }
          Write-Output "Installed: $($app.FullName)"
          pwsh scripts/platform/windows-launch-check.ps1 -App $app.FullName
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself and returns; give it time to finish.
          for ($i = 0; $i -lt 30 -and (Test-Path $app.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw 'The uninstaller left the executable in place.' }
          Write-Output 'Uninstalled.'
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/talkqte-windows"
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *-setup.exe, *.msi |
            Copy-Item -Destination $out
          # The licences of what this build links, beside the installer.
          node scripts/third-party-notices.mjs --target ${{ matrix.target }} --out "$out/THIRD-PARTY-NOTICES.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Could not write the third-party notices.' }
          # Listed before the sums file exists, so it is not hashed while written.
          $sums = @(Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          })
          $sums | Out-File -Encoding ascii "$out/SHA256SUMS.txt"
          @"
          TalkQTE for Windows ${{ matrix.arch }}: UNSIGNED development build
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          These installers are not signed. Windows SmartScreen will warn before
          running them. They are for testing on a machine you control, not a
          release. What this build can and cannot do is in docs/platforms.md.
          THIRD-PARTY-NOTICES.txt lists the licences of what this build links;
          the installed app does not carry its own copy yet.
          CI checked: it installs per user, opens its window, and uninstalls on
          a GitHub-hosted runner. Nothing else was checked on Windows here.
          "@ | Out-File -Encoding utf8 "$out/README-UNSIGNED.txt"
          Get-ChildItem $out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talkqte-windows-${{ matrix.arch }}-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/talkqte-windows/
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: Ubuntu ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the older supported LTS so the package's library
          # requirements are met by both 24.04 and the current 26.04, where
          # the installed package is then checked.
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libwebkit2gtk-4.1-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libasound2-dev xvfb x11-utils dbus
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: platform-ubuntu-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      # A session bus with no service directories, so nothing can be
      # activated on it: the key store must report itself unavailable.
      - name: Keys with a session bus but no Secret Service
        run: |
          cat > "$RUNNER_TEMP/bare-session.conf" <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF
          dbus-run-session --config-file="$RUNNER_TEMP/bare-session.conf" -- \
            cargo test --manifest-path src-tauri/Cargo.toml --locked --lib no_secret_service_is_unavailable -- --ignored
      # A throwaway GNOME Keyring in its own session bus and home, unlocked
      # with a fictional password; a fictional key under a test-only name.
      - name: Round-trip a fictional key through a real Secret Service
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$RUNNER_TEMP/keyring-home" XDG_DATA_HOME="$RUNNER_TEMP/keyring-home/.local/share"
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash -euo pipefail -c '
            printf fictional-password | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_secret_service -- --ignored
          '
      - name: Build the release app, deb and AppImage (unsigned)
        env:
          # The AppImage tools are themselves AppImages; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci
      - name: Launch the built app under a virtual display
        timeout-minutes: 5
        run: xvfb-run -a dbus-run-session -- scripts/platform/linux-launch-check.sh src-tauri/target/release/talkqte
      # As an ordinary user, with the container's seccomp and AppArmor
      # filters lifted so WebKitGTK can start its sandboxed web process
      # (bubblewrap needs user namespaces), as it can on a desktop.
      - name: Install the deb on Ubuntu 26.04 LTS and launch it there
        timeout-minutes: 10
        run: |
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)"
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/src:ro" ubuntu:26.04 bash -euo pipefail -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xauth x11-utils dbus ./src/$deb >/dev/null
            . /etc/os-release; echo \"Installed on \$PRETTY_NAME\"
            pkg=\$(dpkg-deb -f /src/$deb Package)
            dpkg -s \$pkg | grep -E '^(Package|Version|Depends):'
            app=\$(dpkg -L \$pkg | grep '^/usr/bin/' | head -n 1)
            useradd -m tester
            echo \"Launching \$app as an ordinary user\"
            su tester -c \"xvfb-run -a dbus-run-session -- /src/scripts/platform/linux-launch-check.sh \$app\"
          "
      - name: Collect packages and checksums
        run: |
          out="$RUNNER_TEMP/talkqte-ubuntu"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage "$out/"
          # The licences of what this build links, beside the packages.
          node scripts/third-party-notices.mjs --target ${{ matrix.target }} --out "$out/THIRD-PARTY-NOTICES.txt"
          (cd "$out" && sha256sum -- * > SHA256SUMS.txt)
          cat > "$out/README-UNSIGNED.txt" <<EOF
          TalkQTE for Ubuntu ${{ matrix.arch }}: UNSIGNED development build
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          These packages are not signed and come from no apt repository. They are
          for testing on a machine you control, not a release. What this build
          can and cannot do is in docs/platforms.md.
          THIRD-PARTY-NOTICES.txt lists the licences of what this build links;
          the installed app does not carry its own copy yet.
          CI checked: built on Ubuntu 24.04; the deb installs on Ubuntu 26.04 LTS
          and both open their window under a virtual display (Xvfb). The
          AppImage was built but not launched. Nothing else was checked here.
          The AppImage also carries Ubuntu 24.04 system libraries (WebKitGTK,
          GTK and others) under their own licences; they are not listed in
          THIRD-PARTY-NOTICES.txt.
          EOF
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: talkqte-ubuntu-${{ matrix.arch }}-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/talkqte-ubuntu/
          if-no-files-found: error
          retention-days: 14
