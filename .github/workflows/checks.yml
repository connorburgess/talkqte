name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      lab_native_sha:
        description: Must equal reviewed b64cbf6172ed54938a2bfd22353b797c978a1aa8 for its unsigned artifact; empty runs normal checks
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'workflow_dispatch' && inputs.lab_native_sha != '' && format('lab-{0}', inputs.lab_native_sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contributions:
    name: Contribution metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check commit sign-offs and contribution text
        env:
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-contributions.mjs
      - name: Check documentation links and source-backed facts
        env:
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-docs.mjs

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_native_sha == ''
    name: Frontend and browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Match the Playwright version resolved in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace for Git-based checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:contributions
      - run: npm run test:cue-lab
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/lab-hosted-artifact.test.py
      - run: npm run test:cue-cases
      - run: npm run test:docs
      - run: npm run test:release
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_native_sha == ''
    name: macOS Rust and desktop build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-audio-spike,timing-log,claude-cli,lab-evaluator
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features native-audio-spike,timing-log,claude-cli,lab-evaluator -- -D warnings
      - name: Third-party notices match the linked crates and bundled packages
        run: npm run check:notices
      - run: npm run tauri -- build --debug --bundles app
      - name: Pre-flight the debug bundle (no signing, no release)
        run: node scripts/release-preflight.mjs src-tauri/target/debug/bundle/macos/TalkQTE.app

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.lab_native_sha == ''
    name: Windows Arm Rust and desktop build
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustc +1.97.1 -vV
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm run tauri -- build --debug --ci

  lab-artifact:
    name: Unsigned exact-source lab artifact
    if: github.event_name == 'workflow_dispatch' && inputs.lab_native_sha != ''
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Validate reviewed commit selection
        env:
          NATIVE_SHA: b64cbf6172ed54938a2bfd22353b797c978a1aa8
          REQUESTED_NATIVE_SHA: ${{ inputs.lab_native_sha }}
        run: |
          test "$REQUESTED_NATIVE_SHA" = "$NATIVE_SHA"
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: artifact-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b64cbf6172ed54938a2bfd22353b797c978a1aa8
          path: native-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned build toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin
      - name: Build exact unsigned lab app without activation
        working-directory: native-source
        env:
          NATIVE_SHA: b64cbf6172ed54938a2bfd22353b797c978a1aa8
        run: |
          test "$(git rev-parse HEAD)" = "$NATIVE_SHA"
          test -z "$(git status --porcelain)"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$TMPDIR" \
            npm ci
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$TMPDIR" \
            TALKQTE_COMMIT="$NATIVE_SHA" MACOSX_DEPLOYMENT_TARGET=14.0 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/lab-target" \
            npm run tauri -- build --debug --ci --no-sign --bundles app \
            --target aarch64-apple-darwin \
            --features cloud-transcription,lab-evaluator,native-audio-spike,timing-log \
            -- --locked --no-default-features
          test -z "$(git status --porcelain)"
      - name: Verify static provenance and archive app
        env:
          NATIVE_SHA: b64cbf6172ed54938a2bfd22353b797c978a1aa8
        run: |
          python3 artifact-tools/scripts/lab-hosted-artifact.py pack \
            --source native-source --sha "$NATIVE_SHA" \
            --app "$RUNNER_TEMP/lab-target/aarch64-apple-darwin/debug/bundle/macos/TalkQTE.app" \
            --out "$RUNNER_TEMP/lab-export"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-lab-b64cbf6172ed54938a2bfd22353b797c978a1aa8-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-export/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
