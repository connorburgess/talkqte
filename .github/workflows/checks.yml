name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request replaces that pull request's older run.
# Every other run (a merge to main, a manual dispatch) has its own group and
# finishes, so each tree that lands on main gets a complete result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-pr-{0}', github.event.pull_request.number) || format('checks-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contributions:
    name: Contribution metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check commit sign-offs and contribution text
        env:
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-contributions.mjs
      - name: Check documentation links and source-backed facts
        env:
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-docs.mjs

  frontend:
    name: Frontend and browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Match the Playwright version resolved in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace for Git-based checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:contributions
      - run: npm run test:cue-lab
      - run: npm run test:cue-cases
      - run: npm run test:docs
      - run: npm run test:release
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # playwright.config.ts keeps a trace for each failed test. Save them so a
      # failure can be opened with `npx playwright show-trace` instead of being
      # guessed from the log. Tests use only fictional content.
      - name: Save traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS Rust and desktop build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      # Restores compiled dependencies; this repository's own crate is always
      # rebuilt. Only runs on main save the cache, so pull requests share it
      # and cannot fill the repository's cache quota.
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features native-audio-spike,timing-log,claude-cli,lab-evaluator
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features native-audio-spike,timing-log,claude-cli,lab-evaluator -- -D warnings
      - name: Third-party notices match the linked crates and bundled packages
        run: npm run check:notices
      - run: npm run tauri -- build --debug --bundles app
      - name: Pre-flight the debug bundle (no signing, no release)
        run: node scripts/release-preflight.mjs src-tauri/target/debug/bundle/macos/TalkQTE.app

  windows:
    name: Windows Arm Rust and desktop build
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustc +1.97.1 -vV
      # Restores compiled dependencies; this repository's own crate is always
      # rebuilt. Only runs on main save the cache, so pull requests share it
      # and cannot fill the repository's cache quota.
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: npm run tauri -- build --debug --ci
