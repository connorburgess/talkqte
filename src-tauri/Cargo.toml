[package]
name = "talkqte"
version = "0.1.0"
description = "A privacy-focused meeting companion for timely questions and clearer notes"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97.1"

[lib]
name = "talkqte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
