[package]
name = "talkqte"
version = "0.1.0"
description = "A privacy-focused meeting companion for timely questions and clearer notes"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.97.1"

[lib]
name = "talkqte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Development-only lab transport; native selection is wired separately.
lab-evaluator = ["cloud-transcription"]
# Development-only cloud streaming transcription (Deepgram), approved per
# session in the processing review. Never part of a release build.
cloud-transcription = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots"]
# Development-only application audio: one main-window command can list, review
# and start a selected application. Never part of a default build.
native-audio-spike = ["dep:objc2-screen-capture-kit", "dep:objc2-foundation", "dep:dispatch2", "dep:objc2-core-media", "dep:objc2-core-audio-types"]
# Development-only timing log for lab runs with fictional audio: writes one
# JSON line per event to the file named by TALKQTE_TIMING_LOG. No dependency.
timing-log = []
# Development cue backend: registers the Claude Code CLI evaluator for live
# sessions, on the person's own subscription. Sends nothing until the person
# turns the connection on. Never part of a default or release build.
claude-cli = ["dep:regex"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Granola returns meeting listings and note details as tagged text.
quick-xml = "0.42"
# Parse source update times without consulting the local clock or timezone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rtrb = "0.4"
sha2 = "0.10"
# The HTTPS client for the Granola connection; it makes no request until the
# person starts one.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { version = "1", optional = true }
# Randomness for the sign-in's PKCE verifier and state.
getrandom = "0.3"
# Opens the sign-in page in the person's default browser.
open = "5"
# Matches the shared credential pattern in scripts/fixtures/cue-decision.json
# for the development cue backend. Already in the tree through Tauri.
regex = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.2", default-features = false }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView", "NSRunningApplication", "libc", "objc2-core-foundation"] }
# The CGRect the companion's single frame change passes to AppKit.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

# Direct bindings for the isolated native ownership experiment.
objc2-screen-capture-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "SCStream", "SCError", "SCShareableContent", "block2", "dispatch2", "libc", "objc2-core-media", "objc2-core-graphics"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSObject", "NSArray", "NSDictionary", "NSError", "NSString"] }
dispatch2 = { version = "=0.3.1", optional = true }

objc2-core-media = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
