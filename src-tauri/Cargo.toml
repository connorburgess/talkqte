[package]
name = "talkqte"
version = "0.1.0"
description = "A privacy-focused meeting companion for timely questions and clearer notes"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.97.1"

[lib]
name = "talkqte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "replay_clip"
required-features = ["local-whisper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Development-only ownership and PCM validation; no app command enables capture.
native-audio-spike = ["dep:objc2-screen-capture-kit", "dep:objc2-foundation", "dep:dispatch2", "dep:objc2-core-media", "dep:objc2-core-audio-types"]
# Local speech recognition with whisper.cpp. Off by default until model
# delivery is decided; needs CMake and a C++ toolchain to build.
local-whisper = ["dep:whisper-rs"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
whisper-rs = { version = "0.16", optional = true }
serde_json = "1"
# Granola returns meeting listings and note details as tagged text.
quick-xml = "0.42"
# Parse source update times without consulting the local clock or timezone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rtrb = "0.4"
sha2 = "0.10"
# The HTTPS client for the model download and the Granola connection; it
# makes no request until the person starts one.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Randomness for the sign-in's PKCE verifier and state.
getrandom = "0.3"
# Opens the sign-in page in the person's default browser.
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.2", default-features = false }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

# Direct bindings for the isolated native ownership experiment.
objc2-screen-capture-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "SCStream", "SCShareableContent", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSObject", "NSArray", "NSError", "NSString"] }
dispatch2 = { version = "=0.3.1", optional = true }

objc2-core-media = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
