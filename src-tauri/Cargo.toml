[package]
name = "talkqte"
version = "0.1.0"
description = "A meeting companion that surfaces the right cue at the right moment to help keep meetings on target"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.97.1"

[lib]
name = "talkqte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Development-only lab transport; native selection is wired separately.
lab-evaluator = ["cloud-transcription"]
# Development-only Deepgram credential: lets a debug launch point
# transcription at a short-lived token file (TALKQTE_DEV_STT_*) instead of the
# person's stored key. Deepgram streaming itself is in every build and sends
# nothing until the session review is approved. Never part of a release build.
cloud-transcription = []
# Development-only launch settings for application audio
# (TALKQTE_DEV_APPLICATION_SOURCE and friends, read once at launch) and the lab
# paths built on them. Application audio itself, chosen in the notebook, is in
# every macOS build. Never part of a release build.
native-audio-spike = []
# Development-only timing log for lab runs with fictional audio: writes one
# JSON line per event to the file named by TALKQTE_TIMING_LOG. No dependency.
timing-log = []
# Development cue backend: registers the Claude Code CLI evaluator for live
# sessions, on the person's own subscription. Sends nothing until the person
# turns the connection on. Never part of a default or release build.
claude-cli = ["dep:regex"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Granola returns meeting listings and note details as tagged text.
quick-xml = "0.42"
# Parse source update times without consulting the local clock or timezone.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rtrb = "0.4"
sha2 = "0.10"
# The HTTPS client for the Granola connection; it makes no request until the
# person starts one.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Deepgram live streaming: a WebSocket over TLS with the bundled web roots.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# Wipes a provider key from memory once it has been used. Already in the
# tree through rustls.
zeroize = "1"
# Randomness for the sign-in's PKCE verifier and state.
getrandom = "0.3"
# Opens the sign-in page in the person's default browser.
open = "5"
# Matches the shared credential pattern in scripts/fixtures/cue-decision.json
# for the development cue backend. Already in the tree through Tauri.
regex = { version = "1", optional = true }
# NFC normalisation when matching a meeting-notes owner or date against the
# transcript. Already in the tree through idna.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The person's own provider keys in Windows Credential Manager (CredReadW,
# CredWriteW, CredDeleteW). The same windows-sys release Tauri, tokio and
# others already link on Windows; only these two API families are added.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# The person's own provider keys in the desktop keyring through the
# freedesktop Secret Service. Built on the `dbus` crate (libdbus) that the
# Tauri window layer already links on Linux; no cryptography features, so it
# adds no other crate. Pinned.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.2.0", default-features = false }

# The default microphone: Core Audio on macOS, WASAPI on Windows, ALSA on
# Linux (PipeWire or PulseAudio through their ALSA plugin). The same release
# on each; its Windows and Linux dependencies (windows, alsa) were already in
# the lockfile.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
cpal = { version = "0.18.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView", "NSRunningApplication", "NSWorkspace", "libc", "objc2-core-foundation"] }
# The CGRect the companion's single frame change passes to AppKit.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
# The person's own provider keys in the login Keychain (generic passwords
# through Security.framework). The standard binding; no default features.
security-framework = { version = "3", default-features = false }
# One selected application's audio through ScreenCaptureKit, only after the
# person chooses it in the notebook. Direct bindings, pinned.
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "SCStream", "SCError", "SCShareableContent", "block2", "dispatch2", "libc", "objc2-core-media", "objc2-core-graphics"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSArray", "NSDictionary", "NSError", "NSString", "NSUUID", "NSValue"] }
dispatch2 = { version = "=0.3.1" }
# The menu bar item (Tauri's status item, on the tray-icon crate already in
# the lock file) and "Open at login" through SMAppService (macOS 13+; the
# app's minimum is 14).
tauri = { version = "2", features = ["tray-icon"] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }

# Exercise the macOS import regression against the generated production ACL.
tauri = { version = "2", features = ["test"] }
