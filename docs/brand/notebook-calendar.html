<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook Calendar Home (Designed, not built) · TalkQTE</title>
    <link rel="stylesheet" href="../../src/tokens.css" />
    <style>
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('./fonts/manrope-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--band);
        color: var(--ink);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--band);
        color: var(--ink);
        overflow-x: clip;
      }

      ::selection {
        background: var(--selection);
        color: var(--ink);
      }

      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      dl,
      dt,
      dd {
        margin: 0;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .mono-tag {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1.3;
      }

      /* Prototype Banner & State Switcher (outside app chrome) */
      .proto-bar {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: var(--space-12) var(--space-24);
      }

      .proto-bar-inner {
        max-width: 1360px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

      .proto-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: var(--space-12);
      }

      .proto-title-group {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-12);
      }

      .proto-title-group h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border-radius: var(--radius-control);
        border: 1px solid var(--border);
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .status-pill.is-amber {
        border-color: var(--accent-ink);
        background: var(--cue-asked-surface);
        color: var(--accent-ink);
      }

      .status-pill.is-error {
        border-color: var(--danger);
        background: var(--danger-surface);
        color: var(--danger);
      }

      .proto-links {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-16);
        font-size: 13px;
      }

      .proto-links a {
        color: var(--accent-ink);
        text-decoration: underline;
        text-underline-offset: 0.22em;
      }

      .proto-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-12);
        padding-top: var(--space-8);
        border-top: 1px solid var(--line);
      }

      .proto-group {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .proto-group-label {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-right: 4px;
      }

      .chip-btn {
        min-height: 32px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--paper);
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease;
      }

      .chip-btn:hover {
        border-color: var(--border);
        color: var(--ink);
      }

      .chip-btn[aria-pressed='true'] {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
      }

      /* App Canvas Stage */
      .stage {
        padding: var(--space-24);
        max-width: 1380px;
        margin: 0 auto;
      }

      .app-frame {
        margin: 0 auto;
        width: 100%;
        padding: var(--space-8);
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(17, 21, 27, 0.06);
        transition: max-width 200ms ease;
      }

      .app-frame.is-narrow {
        max-width: 390px;
      }

      /* Desktop Notebook Shell */
      .app-shell {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 760px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }

      .sidebar {
        background: var(--band);
        border-right: 1px solid var(--line);
        padding: var(--space-24) var(--space-12) var(--space-16);
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 var(--space-8) var(--space-16);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--ink);
        text-decoration: none;
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
      }

      .nav-btn:hover {
        background: rgba(17, 21, 27, 0.04);
      }

      .nav-btn.is-selected {
        background: var(--paper);
        border-color: var(--border);
        font-weight: 600;
      }

      .sidebar-foot {
        margin-top: auto;
        padding-top: var(--space-16);
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

      .build-foot {
        padding: var(--space-12) var(--space-8) 0;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: var(--space-8);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
      }

      /* Main Workspace */
      .workspace {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--paper);
      }

      .toolbar {
        min-height: 52px;
        padding: 8px var(--space-24);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .breadcrumb strong {
        color: var(--ink);
        font-weight: 600;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: var(--space-12);
        flex-wrap: wrap;
      }

      /* Return-to-Live Banner (when glancing at calendar during a live call) */
      .live-return-banner {
        padding: var(--space-12) var(--space-24);
        background: var(--cue-asked-surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        flex-wrap: wrap;
      }

      .live-return-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: var(--ink);
        flex-wrap: wrap;
      }

      .square-dot {
        width: 7px;
        height: 7px;
        border-radius: 1px;
        background: var(--accent-ink);
        display: inline-block;
        flex-shrink: 0;
      }

      .square-dot.is-muted {
        background: var(--border);
      }

      .square-dot.is-error {
        background: var(--danger);
      }

      /* Shared Buttons */
      .btn-primary,
      .btn-secondary,
      .btn-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: var(--radius-control);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .btn-primary {
        min-height: 44px;
        padding: 9px 16px;
        border: 1px solid var(--btn-primary-bg);
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--btn-primary-bg-hover);
        border-color: var(--btn-primary-bg-hover);
      }

      .btn-secondary {
        min-height: 40px;
        padding: 7px 13px;
        border: 1px solid var(--border);
        background: var(--paper);
        color: var(--ink);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--band);
      }

      .btn-secondary.is-compact {
        min-height: 36px;
        padding: 5px 10px;
        font-size: 13px;
      }

      .btn-icon {
        min-width: 40px;
        min-height: 40px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--paper);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .btn-icon:hover:not(:disabled) {
        background: var(--band);
      }

      .btn-icon:disabled,
      .btn-secondary:disabled,
      .btn-primary:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      .btn-text {
        min-height: 36px;
        padding: 4px 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--accent-ink);
        font-size: 13px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 0.22em;
      }

      .btn-text:hover {
        color: var(--ink);
      }

      /* Calendar Home Header + 7-day Strip */
      .cal-header {
        padding: var(--space-16) var(--space-24) var(--space-16);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

      .cal-header-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-16);
        flex-wrap: wrap;
      }

      .cal-date-nav {
        display: flex;
        align-items: center;
        gap: var(--space-12);
        flex-wrap: wrap;
      }

      .cal-date-nav h2 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      .cal-tz {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
      }

      .cal-nav-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .cal-sync-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted);
      }

      .sync-meta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
      }

      .sync-meta.is-stale {
        color: var(--accent-ink);
      }

      .sync-meta.is-error {
        color: var(--danger);
      }

      /* 7-Day Week Strip */
      .week-strip {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        padding: 4px;
        background: var(--band);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
      }

      .day-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: 54px;
        padding: 6px 4px;
        border: 1.5px solid transparent;
        border-radius: var(--radius-control);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease;
      }

      .day-cell:hover {
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
      }

      .day-cell.is-today .day-num {
        color: var(--accent-ink);
        font-weight: 700;
      }

      .day-cell.is-selected {
        background: var(--paper);
        border-color: var(--ink);
        color: var(--ink);
      }

      .day-dow {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .day-num {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .day-dots {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        min-height: 5px;
      }

      .day-dot {
        width: 4px;
        height: 4px;
        border-radius: 1px;
        background: var(--border);
      }

      .day-cell.is-today .day-dot {
        background: var(--accent-ink);
      }

      /* Inline Notice / Error Banners */
      .inline-banner {
        margin: var(--space-16) var(--space-24) 0;
        padding: var(--space-12) var(--space-16);
        border-radius: var(--radius-control);
        border: 1px solid var(--border);
        background: var(--band);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-12);
        flex-wrap: wrap;
        font-size: 13.5px;
      }

      .inline-banner.is-error {
        border-color: var(--danger);
        background: var(--danger-surface);
        color: var(--danger);
      }

      .inline-banner.is-amber {
        border-color: var(--accent-ink);
        background: var(--cue-asked-surface);
        color: var(--ink);
      }

      .inline-banner p {
        max-width: 66ch;
      }

      .inline-banner-actions {
        display: flex;
        align-items: center;
        gap: var(--space-8);
        flex-wrap: wrap;
      }

      /* Home Two-Column Body: Agenda + Prepare Pane */
      .home-split {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        flex: 1;
        min-height: 0;
      }

      .agenda-col {
        padding: var(--space-16) var(--space-24) var(--space-24);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--space-16);
        min-width: 0;
      }

      .prep-col {
        padding: var(--space-16) var(--space-24) var(--space-24);
        display: flex;
        flex-direction: column;
        gap: var(--space-16);
        min-width: 0;
        background: var(--paper);
      }

      .col-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-8);
        flex-wrap: wrap;
      }

      .col-head h3 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .col-sub {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
      }

      /* All-Day Row */
      .all-day-strip {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-8);
        padding-bottom: var(--space-12);
        border-bottom: 1px solid var(--line);
      }

      .all-day-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--band);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
      }

      .all-day-chip:hover {
        border-color: var(--border);
      }

      .all-day-chip.is-selected {
        border-color: var(--ink);
        background: var(--paper);
        font-weight: 600;
      }

      /* Agenda Event List */
      .agenda-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
      }

      .event-row {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--paper);
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        gap: var(--space-12);
        align-items: start;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .event-row:hover {
        border-color: var(--border);
        background: var(--band);
      }

      .event-row.is-now {
        background: var(--cue-asked-surface);
        border: 1.5px solid var(--accent-ink);
      }

      .event-row.is-selected {
        border: 1.5px solid var(--ink);
        background: var(--band);
      }

      .event-row.is-now.is-selected {
        background: var(--cue-asked-surface);
        border: 1.5px solid var(--ink);
      }

      .event-row.is-past {
        opacity: 0.72;
      }

      .event-time {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .event-time .now-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .event-time .time-sub {
        font-size: 11px;
        color: var(--muted);
      }

      .event-body {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .event-title-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-8);
        flex-wrap: wrap;
      }

      .event-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
      }

      .event-meta-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .meta-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--paper);
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--muted);
      }

      .meta-tag.is-overlap {
        border-color: var(--accent-ink);
        background: var(--cue-asked-surface);
        color: var(--accent-ink);
      }

      .agenda-foot {
        margin-top: auto;
        padding-top: var(--space-12);
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }

      /* Empty / Disconnected / Denied / Skeleton States inside Agenda */
      .agenda-state-box {
        padding: var(--space-24);
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        background: var(--band);
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

      .agenda-state-box.is-error {
        border-color: var(--danger);
        background: var(--danger-surface);
      }

      .agenda-state-box h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
      }

      .agenda-state-box p {
        font-size: 14px;
        color: var(--muted);
        max-width: 54ch;
      }

      .agenda-state-box.is-error p {
        color: var(--danger);
      }

      .state-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-8);
        padding-top: var(--space-4);
      }

      .skeleton-row {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: var(--space-12);

      .skel {
        height: 12px;
        border-radius: 2px;
        background: var(--line);

      .skel.is-wide {
        width: 78%;
        height: 14px;
        margin-bottom: 8px;
      }

      .skel.is-mid {
        width: 48%;

        flex-direction: column;
        gap: var(--space-12);

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-8);
        flex-wrap: wrap;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
      }

      .title-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .title-field label {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);

      .title-input-row {
        display: flex;
        gap: var(--space-8);
        align-items: center;

        flex: 1;
        min-width: 0;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--paper);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }

      .start-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .start-row {
        display: flex;
        align-items: center;
        gap: var(--space-8);
        flex-wrap: wrap;
      }

      .disclosure-copy {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.45;
      }

      .prep-notes-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .prep-notes-area label {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
      }

      .prep-notes-area textarea {
        width: 100%;
        min-height: 116px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--paper);
        resize: vertical;
        font-size: 14.5px;
        line-height: 1.6;
      }

      .prep-disclosure {
        border-top: 1px solid var(--line);
        padding-top: var(--space-12);
      }

      .prep-disclosure summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-8);
        min-height: 36px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .prep-disclosure summary::-webkit-details-marker {
        display: none;
      }

      .prep-disclosure-body {
        padding-top: var(--space-8);
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
        font-size: 13.5px;
        color: var(--muted);
      }

      .context-item {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--cue-surface);
        display: flex;
        justify-content: space-between;
        gap: var(--space-8);
        align-items: center;
      }

      .context-item strong {
        display: block;
        font-size: 13.5px;
        color: var(--ink);
      }

      .context-item span {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
      }

      .prep-cue-standby {
        margin-top: auto;
        padding: var(--space-12) var(--space-16);
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        background: var(--cue-surface);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .prep-cue-standby-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
      }

      .prep-cue-standby p {
        font-size: 13px;
        color: var(--muted);
      }

      /* Live Session View (Calendar cleanly tucked away) */
      .live-body {
        padding: var(--space-16) var(--space-24) var(--space-24);
        display: flex;
        flex-direction: column;
        gap: var(--space-16);
        flex: 1;
      }

      .live-capture-row {
        padding-bottom: var(--space-12);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        flex-wrap: wrap;
      }

      .live-telemetry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        padding-bottom: var(--space-12);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }

      .live-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: var(--space-24);
        flex: 1;
      }

      .live-tabs {
        display: flex;
        gap: var(--space-16);
        border-bottom: 1px solid var(--line);
        margin-bottom: var(--space-12);
      }

      .live-tab {
        padding: 8px 0;
        border: 0;
        background: transparent;
        font-size: 14px;
        color: var(--muted);
        cursor: pointer;
      }

      .live-tab.is-active {
        color: var(--ink);
        font-weight: 600;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 8px;
      }

      .cue-card-proto {
        padding: 18px 20px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        background: var(--cue-surface);
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

      .cue-lead {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--accent-ink);
      }

      .cue-card-proto h3 {
        font-size: 21px;
        font-weight: 600;
        line-height: 1.24;
        letter-spacing: -0.015em;
      }

      .cue-timeline {
        height: 3px;
        border-radius: 1px;
        background: var(--line);
        overflow: hidden;
      }

      .cue-timeline-fill {
        width: 68%;
        height: 100%;
        background: var(--cue-fill);
      }

      .cue-source {
        padding-top: var(--space-8);
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--muted);
      }

      /* Settings -> Calendar View */
      .settings-wrap {
        padding: var(--space-24);
        max-width: 780px;
        display: flex;
        flex-direction: column;
        gap: var(--space-24);
      }

      .settings-section {
        padding-bottom: var(--space-24);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--space-12);
      }

        border-bottom: 0;
      }

      .settings-section h3 {
        font-size: 17px;
        font-weight: 600;
      }

      .settings-section p {
        font-size: 14px;
        color: var(--muted);
        max-width: 65ch;
      }

      .check-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 36px;
        font-size: 14px;
        cursor: pointer;
      }

      .check-row input[type='checkbox'] {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: var(--ink);
      }

      .cal-source-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: var(--space-12) var(--space-16);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--band);
      }

      .cal-source-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }

      .cal-source-row:last-child {
        border-bottom: 0;
      }

      .future-box {
        padding: var(--space-16);
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--band);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .workspace-foot {
        padding: var(--space-12) var(--space-24);
        border-top: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--muted);
      }

      /* Narrow Layout (both viewport <= 860px and simulated .app-frame.is-narrow) */
      .app-frame.is-narrow .app-shell {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .app-frame.is-narrow .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: var(--space-12);
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

        padding: 0;
        font-size: 16px;

        flex-direction: row;
        gap: 4px;
      }

      .app-frame.is-narrow .nav-btn {
        width: auto;
        min-height: 36px;
        padding: 6px 10px;
        font-size: 13px;
      }

      .app-frame.is-narrow .sidebar-foot {
        display: none;
      }

      .app-frame.is-narrow .toolbar,
      .app-frame.is-narrow .cal-header,
      .app-frame.is-narrow .agenda-col,

      .app-frame.is-narrow .settings-wrap,
      .app-frame.is-narrow .workspace-foot {
        padding-left: var(--space-16);
        padding-right: var(--space-16);
      }

      .app-frame.is-narrow .inline-banner {
        margin-left: var(--space-16);
        margin-right: var(--space-16);
      }

      .app-frame.is-narrow .home-split,

      }

      .app-frame.is-narrow .agenda-col {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .app-frame.is-narrow .event-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      @media (max-width: 860px) {
        .stage {
          padding: var(--space-12);
        }
        .proto-bar {
          padding: var(--space-12) var(--space-16);
        }
        .app-shell {
          grid-template-columns: 1fr;
          min-height: 0;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: var(--space-12);
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
        }
        .brand {
          padding: 0;
          font-size: 16px;
        }
        .nav-list {
          flex-direction: row;
        }
        .nav-btn {
          width: auto;
          min-height: 36px;
          padding: 6px 10px;
        }
        .sidebar-foot {
          display: none;
        }
        .home-split,
        .live-grid {
          grid-template-columns: 1fr;
        }
        .agenda-col {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .event-row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
