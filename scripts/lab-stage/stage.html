<!doctype html>
<!--
  Stage for lab recordings. Everything on this page except the TalkQTE frame
  is a mock: an invented video call that stands in for the meeting app, and
  a small lab overlay that says what the evaluator is doing. The frame is
  the real TalkQTE companion (or, in the notebook view, the real notebook),
  fed a simulated session. The cue card is what the recording is about: the
  companion is drawn large and the call is quiet background.
  Fictional people and words only. Never used by the app or shipped in it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simulated replay (fictional)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1114;
        color: #e9edf1;
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      /* Small and out of the card's way, but there for the whole recording. */
      #banner {
        position: absolute;
        inset: 0 0 auto 0;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: #f3c94b;
        color: #1c1500;
        font-size: 12.5px;
        font-weight: 600;
        z-index: 5;
      }
      #banner .tag {
        background: #1c1500;
        color: #f3c94b;
        border-radius: 4px;
        padding: 1px 7px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      #banner .grow {
        flex: 1;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }
      /* The mock call: quiet background context on the left. */
      #call {
        position: absolute;
        inset: 28px 0 0 0;
        display: flex;
        flex-direction: column;
        padding: 20px 20px 0;
        background: radial-gradient(120% 90% at 30% 0%, #1b2128, #0e1114);
      }
      #call header {
        display: flex;
        gap: 14px;
        align-items: baseline;
        color: #7d8793;
        font-size: 13px;
        padding: 0 4px 12px;
      }
      #call header strong {
        color: #c5ccd4;
        font-size: 15px;
        font-weight: 600;
      }
      #speaker-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        /* The call fills the screen, as a meeting window does. */
      }
      /* A gallery, as a call shows a few people: equal tiles, with the
         companion floating over the seam between the top two. */
      #tiles {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 1fr;
        gap: 10px;
      }
      #tiles.odd .tile:last-child {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc(50% - 5px);
      }
      .tile {
        position: relative;
        border-radius: 16px;
        background: linear-gradient(160deg, #262d36, #1a1f26);
        display: grid;
        place-items: center;
        outline: 3px solid transparent;
        transition:
          outline-color 160ms ease-out,
          background 300ms ease-out;
        overflow: hidden;
      }
      .tile.speaking {
        outline-color: #4f9a66;
        background: linear-gradient(160deg, #2b3640, #1c232b);
      }
      .avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 42px;
        font-weight: 600;
        color: #10151a;
      }
      .tile .name {
        position: absolute;
        left: 12px;
        bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(8, 10, 12, 0.6);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 14px;
      }
      .tile .name small {
        color: #9aa5b1;
      }
      .bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        opacity: 0;
      }
      .speaking .bars {
        opacity: 1;
      }
      .bars i {
        width: 3px;
        background: #6fd08c;
        border-radius: 1px;
        animation: bar 620ms ease-in-out infinite alternate;
      }
      .bars i:nth-child(2) {
        animation-delay: 150ms;
      }
      .bars i:nth-child(3) {
        animation-delay: 320ms;
      }
      @keyframes bar {
        from {
          height: 3px;
        }
        to {
          height: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bars i {
          animation: none;
          height: 8px;
        }
      }
      #caption {
        min-height: 82px;
        margin: 12px 0 0;
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(8, 10, 12, 0.72);
        font-size: 19px;
        line-height: 1.35;
      }
      #caption b {
        color: #9fe0b3;
        font-weight: 600;
      }
      #caption:empty::before {
        content: 'Mock call captions';
        color: #5f6975;
      }
      #toolbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        height: 58px;
        opacity: 0.6;
      }
      #toolbar span.btn {
        width: 44px;
        height: 32px;
        border-radius: 16px;
        background: #2a313a;
      }
      #toolbar span.leave {
        background: #b6453c;
        width: 60px;
      }
      /* The real companion at its real size, floating over the call near
         the top centre, where someone would keep it by the camera. */
      #companion {
        position: absolute;
        top: 46px;
        left: calc(50% - 210px);
        width: 420px;
        height: 76px;
        border: 0;
        border-radius: 28px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        z-index: 3;
        background: transparent;
      }
      /* Invented portraits in the tiles, when the take has them. */
      .tile.has-portrait {
        background-size: cover;
        background-position: center 25%;
      }
      .tile.has-portrait .avatar {
        display: none;
      }
      #side {
        display: none;
      }
      #notebook {
        flex: 1;
        min-height: 0;
        border: 0;
        background: #fff;
      }
      /* Small print for the lab's own account of what happened. */
      #lab {
        position: absolute;
        left: 20px;
        bottom: 4px;
        width: 430px;
        height: 52px;
        padding: 7px 12px 8px;
        border-left: 2px solid #f3c94b;
        background: rgba(14, 17, 20, 0.82);
        font-size: 12px;
        z-index: 2;
      }
      #lab h2 {
        margin: 0 0 3px;
        font-size: 10.5px;
        font-weight: 600;
        color: #c9a53f;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #activity {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column-reverse;
        height: calc(100% - 16px);
        overflow: hidden;
      }
      #activity li {
        display: flex;
        gap: 8px;
        padding: 1px 0;
        color: #9aa5b1;
        white-space: nowrap;
      }
      #activity time {
        color: #6c7682;
        font-variant-numeric: tabular-nums;
      }
      #activity .show {
        color: #9fe0b3;
      }
      #activity .gone {
        color: #e7b38a;
      }
      #activity .dropped {
        color: #6c7682;
      }
      /* The optional second video: the notebook alone, with the labels. */
      /* The meeting emulator: the mock call alone, with no TalkQTE in it,
         for the real app to hear. */
      .view-meeting #companion,
      .view-meeting #side,
      .view-meeting #lab {
        display: none;
      }
      .no-captions #caption {
        visibility: hidden;
      }
      .view-notebook #call,
      .view-notebook #companion {
        display: none;
      }
      .view-notebook #side {
        display: flex;
        position: absolute;
        inset: 28px 0 132px 0;
      }
      .view-notebook #lab {
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
      }
      #intro {
        position: absolute;
        inset: 28px 0 0 0;
        z-index: 4;
        display: grid;
        place-items: center;
        background: rgba(10, 12, 15, 0.94);
        text-align: center;
        /* A title card only: the frames beneath stay reachable. */
        pointer-events: none;
      }
      #intro[hidden] {
        display: none;
      }
      #intro h1 {
        font-size: 34px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      #intro p {
        margin: 6px auto;
        max-width: 760px;
        color: #b6bfc9;
        font-size: 18px;
      }
      #intro .rule {
        color: #f3c94b;
      }
    </style>
  </head>
  <body>
    <div id="banner" role="note" aria-label="Recording label">
      <span class="tag" id="simulated">Simulated</span>
      <span class="tag">Fictional</span>
      <span class="tag" id="decisions"></span>
      <span class="tag" id="sound" hidden></span>
      <span class="tag" id="portraits" hidden></span>
      <span class="grow" id="source"></span>
      <span id="clock">0:00</span>
    </div>

    <section id="call" aria-label="Mock video call">
      <header>
        <strong id="title"></strong>
        <span>Mock call. Not a real meeting or meeting app.</span>
      </header>
      <div id="speaker-view">
        <div id="tiles"></div>
      </div>
      <p id="caption" aria-live="off"></p>
      <div id="toolbar" aria-hidden="true">
        <span class="btn"></span><span class="btn"></span
        ><span class="btn"></span><span class="btn leave"></span>
      </div>
    </section>

    <iframe id="companion" title="TalkQTE companion" src="about:blank"></iframe>

    <aside id="side">
      <iframe id="notebook" title="TalkQTE notebook" src="about:blank"></iframe>
    </aside>

    <section id="lab" aria-label="Lab overlay">
      <h2>Lab overlay · not part of TalkQTE</h2>
      <ol id="activity"></ol>
    </section>

    <div id="intro">
      <div>
        <h1 id="intro-title"></h1>
        <p id="intro-setting"></p>
        <p class="rule" id="intro-rule"></p>
        <p id="intro-source"></p>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const clock = (ms) => {
        const s = Math.max(0, Math.floor(ms / 1000));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      };
      const COLORS = ['#f2b880', '#9ecbf0', '#c7b3f5', '#9fe0b3', '#f5a3b5'];
      const COMPANION = { resting: 76, question: 340 };
      let data = null;
      let startedAt = null;
      let now = 0;
      // One TalkQTE frame per video: the companion over the call, or the
      // notebook by itself.
      const frames = () =>
        data.view === 'meeting'
          ? []
          : [
              $(data.view === 'notebook' ? 'notebook' : 'companion')
                .contentWindow,
            ];
      // Times things happened, for the live emulator to report.
      const report = (type, extra = {}) =>
        window.stageEvents?.(type, { clockMs: Math.round(now), ...extra });
      // Set while playing, so lines can be added to a live meeting.
      let schedule = [];
      let next = 0;

      function note(text, kind = '') {
        const item = document.createElement('li');
        item.className = kind;
        const time = document.createElement('time');
        time.textContent = clock(now);
        const span = document.createElement('span');
        span.textContent = text;
        item.append(time, span);
        $('activity').prepend(item);
      }

      async function waitFor(test, what) {
        const until = performance.now() + 20_000;
        while (!test()) {
          if (performance.now() > until) throw new Error(`Timed out: ${what}`);
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
      }

      window.stage = {
        clock: () => now,
        /** Loads the TalkQTE frame and starts a simulated session in it. */
        async prepare(value) {
          data = value;
          document.body.classList.toggle(
            'view-notebook',
            data.view === 'notebook',
          );
          const meeting = data.view === 'meeting';
          document.body.classList.toggle('view-meeting', meeting);
          document.body.classList.toggle(
            'no-captions',
            data.captions === false,
          );
          $('intro-rule').textContent = meeting
            ? 'A simulated meeting with fictional people and synthetic voices. TalkQTE is not in this window.'
            : data.view === 'notebook'
              ? 'Simulated replay of a fictional conversation. This is the TalkQTE notebook during it.'
              : 'Simulated replay of a fictional conversation. The call is a mock; the companion is TalkQTE.';
          if (meeting) $('simulated').textContent = 'Simulated meeting';
          // The tags' own style would override the hidden attribute.
          $('decisions').style.display = meeting ? 'none' : '';
          $('title').textContent = data.title;
          // A meeting has no cue decisions of its own: the app makes them.
          $('decisions').textContent = meeting ? '' : data.decisions;
          $('sound').textContent = data.sound;
          $('sound').hidden = !data.sound;
          $('portraits').textContent = data.portraitsLabel;
          $('portraits').hidden = !data.portraitsLabel;
          $('source').textContent = meeting
            ? `${data.title} · a mock call for TalkQTE to hear`
            : `${data.title} · cue decisions: ${data.evaluator} · ${data.timing}`;
          $('intro-title').textContent = data.title;
          $('intro-setting').textContent = data.setting;
          $('intro-source').textContent = meeting
            ? ''
            : `Cue decisions: ${data.evaluator}. ${data.timing}.`;
          const tiles = $('tiles');
          tiles.classList.toggle('odd', data.participants.length % 2 === 1);
          for (const [i, person] of data.participants.entries()) {
            person.color = COLORS[i % COLORS.length];
            person.label =
              person.name === data.listener
                ? `${person.name} (you)`
                : person.name;
            person.role = person.role.replace(/ \(listener\)$/, '');
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.name = person.name;
            if (person.portrait) {
              tile.classList.add('has-portrait');
              tile.style.backgroundImage = `url("${person.portrait}")`;
            }
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.style.background = person.color;
            avatar.textContent = person.name[0];
            const name = document.createElement('div');
            name.className = 'name';
            const bars = document.createElement('span');
            bars.className = 'bars';
            bars.append(...[0, 1, 2].map(() => document.createElement('i')));
            const label = document.createElement('span');
            label.textContent = person.label;
            const role = document.createElement('small');
            role.textContent = person.role;
            name.append(bars, label, role);
            tile.append(avatar, name);
            tiles.append(tile);
          }
          if (meeting) return;
          if (data.view === 'notebook') $('notebook').src = `${data.origin}/`;
          else $('companion').src = `${data.origin}/?window=cue`;
          await waitFor(
            () => frames().every((frame) => frame.liveTest),
            'TalkQTE frames',
          );
          // A simulated session, not a live one: the app then says in its
          // own words that this is a simulated, fictional replay, and never
          // claims a microphone.
          for (const frame of frames())
            await frame.liveTest.simulate({
              title: data.title,
              durationMs: data.endsAtMs,
            });
        },
        /** Plays the replay on its own clock; resolves when it is over. */
        async play() {
          const lines = new Map(data.lines.map((line) => [line.id, line]));
          schedule = [
            ...data.lines.flatMap((line) => [
              { atMs: line.fromMs, kind: 'speak', line },
              { atMs: line.atMs, kind: 'spoken', line },
            ]),
            // The meeting emulator shows no cues: the real app makes its own.
            ...(data.view === 'meeting' ? [] : data.timeline).map((event) => ({
              ...event,
              kind: event.type,
            })),
          ].sort((a, b) => a.atMs - b.atMs);
          next = 0;
          // Lines added while a live meeting plays.
          this.append = (added) => {
            for (const line of added) {
              lines.set(line.id, line);
              data.lines.push(line);
              if (line.clip) (data.clips ??= {})[line.id] = line.clip;
              schedule.push(
                { atMs: line.fromMs, kind: 'speak', line },
                { atMs: line.atMs, kind: 'spoken', line },
              );
              data.endsAtMs = Math.max(data.endsAtMs, line.atMs + 3_000);
            }
            const done = schedule.slice(0, next);
            const rest = schedule.slice(next).sort((a, b) => a.atMs - b.atMs);
            schedule = [...done, ...rest];
          };
          const transcript = [];
          let cue = null;
          let newestText = null;
          // Keeps the newest transcript line in view in the notebook. The
          // line is found by its words, and its list or the page is scrolled.
          const follow = () => {
            if (!newestText || data.view !== 'notebook') return;
            const view = $('notebook').contentWindow;
            const walker = view.document.createTreeWalker(
              view.document.body,
              NodeFilter.SHOW_TEXT,
            );
            let found = null;
            while (walker.nextNode())
              if (walker.currentNode.nodeValue.includes(newestText))
                found = walker.currentNode.parentElement;
            let scrolled = false;
            for (let box = found; box && !scrolled; box = box.parentElement) {
              const style = view.getComputedStyle(box);
              if (
                /auto|scroll/.test(style.overflowY) &&
                box.scrollHeight > box.clientHeight
              ) {
                box.scrollTop = box.scrollHeight;
                scrolled = true;
              }
            }
            // Otherwise the page itself scrolls.
            if (!scrolled) found?.scrollIntoView({ block: 'end' });
            newestText = null;
          };
          const publish = async () => {
            const state = {
              elapsedMs: Math.round(now),
              transcript: [...transcript],
              cue: cue && {
                ...cue.card,
                remainingMs: Math.max(0, Math.round(cue.expiresAtMs - now)),
              },
            };
            for (const frame of frames()) await frame.liveTest.publish(state);
            // After the notebook has drawn the new line.
            setTimeout(follow, 120);
          };
          const apply = (event) => {
            if (event.kind === 'speak') {
              // The live emulator plays each line's own clip as it starts.
              const clip = data.clips?.[event.line.id];
              if (clip) new Audio(clip).play().catch(() => {});
              report('speak', { lineId: event.line.id, sound: Boolean(clip) });
              for (const tile of document.querySelectorAll('#tiles .tile'))
                tile.classList.toggle(
                  'speaking',
                  tile.dataset.name === event.line.speaker,
                );
              const caption = $('caption');
              caption.textContent = '';
              const who = document.createElement('b');
              who.textContent = `${event.line.speaker}: `;
              caption.append(who, event.line.text);
            } else if (event.kind === 'spoken') {
              report('spoken', { lineId: event.line.id });
              for (const tile of document.querySelectorAll('.tile'))
                tile.classList.remove('speaking');
            } else if (event.kind === 'line') {
              const line = lines.get(event.lineId);
              // As a live transcript labels it today: one speaker label.
              transcript.push({
                id: line.id,
                atMs: event.atMs,
                speaker: 'Speaker',
                text: line.text,
              });
              newestText = line.text;
            } else if (event.kind === 'evaluation-start') {
              note(`Evaluator asked after line ${event.lineId.slice(1)}`);
            } else if (event.kind === 'decision') {
              const seconds = `${(event.latencyMs / 1000).toFixed(1)} s`;
              if (event.outcome === 'superseded')
                note(
                  `Decision "${event.action}" dropped after ${seconds}: newer speech arrived`,
                  'dropped',
                );
              else if (event.outcome !== 'applied')
                note(
                  `Decision "${event.action}" not applied (${event.outcome})`,
                  'dropped',
                );
              else if (event.action === 'quiet')
                note(`Decided to stay quiet (${seconds})`);
              else note(`Decided: ${event.action} (${seconds})`, 'show');
            } else if (event.kind === 'cue-shown') {
              const sources = event.sourceIds.map((id) => lines.get(id));
              cue = {
                expiresAtMs: event.expiresAtMs,
                card: {
                  id: event.cueId,
                  kind: 'Suggestion',
                  question: event.text,
                  evidence: sources.at(-1).text,
                  sourceId: `transcript:${sources.at(-1).id}`,
                  sources: sources.map((line) => ({
                    id: `transcript:${line.id}`,
                    revision: 0,
                    text: line.text,
                    provenance: {
                      kind: 'transcript',
                      atMs: line.arrivesAtMs,
                      speaker: 'Speaker',
                    },
                  })),
                  totalMs: event.expiresAtMs - event.atMs,
                  held: false,
                  expanded: false,
                  resolvedBy: null,
                  note: null,
                  aboutFocus: false,
                },
              };
              $('companion').style.height = `${COMPANION.question}px`;
              note('Cue on screen', 'show');
            } else if (event.kind === 'cue-cleared') {
              cue = null;
              $('companion').style.height = `${COMPANION.resting}px`;
              note(
                event.why === 'expired'
                  ? 'Cue expired unread'
                  : `Cue cleared: ${event.why}`,
                'gone',
              );
            }
          };
          $('intro').hidden = true;
          startedAt = performance.now();
          report('start');
          let published = -Infinity;
          for (;;) {
            now = (performance.now() - startedAt) * data.speed;
            let changed = false;
            while (next < schedule.length && schedule[next].atMs <= now) {
              apply(schedule[next++]);
              changed = true;
            }
            $('clock').textContent = clock(now);
            // Republish on a change, and a few times a second so the cue's
            // remaining time and the session clock keep moving.
            if (changed || now - published >= 250 * data.speed) {
              await publish();
              published = now;
            }
            if (now >= data.endsAtMs) break;
            await new Promise((resolve) => setTimeout(resolve, 40));
          }
          for (const tile of document.querySelectorAll('.tile'))
            tile.classList.remove('speaking');
          report('end');
        },
      };

      // The live meeting emulator: the page fetches its meeting from the
      // local server that served it, plays it in real time with each
      // line's sound, takes lines added while it plays, and reports when
      // each line started and ended. Only with ?live in the address.
      if (new URLSearchParams(location.search).has('live'))
        (async () => {
          const value = await (await fetch('/data.json')).json();
          window.stageEvents = (type, extra) =>
            fetch('/played', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ type, wallMs: Date.now(), ...extra }),
            }).catch(() => {});
          await window.stage.prepare(value);
          new EventSource('/events').addEventListener('append', (event) =>
            window.stage.append?.(JSON.parse(event.data)),
          );
          setTimeout(() => window.stage.play(), value.startDelayMs ?? 3_000);
        })();
    </script>
  </body>
</html>
